[package]
name = "holyballs"
version = "0.2.0"
edition = "2024"

[dependencies]
bevy = {version = "0.19.0"}
bevy_rapier3d = { version = "0.35.0", features = [ "simd-stable", "debug-render-3d" ] }
rand = "0.10.2"
bevy_fontmesh = {version="0.6.0"}
getrandom = { version = "0.4.3", features = ["wasm_js"] }
wasm-bindgen = "0.2.126"
crossfire = "3.1.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
lto = false
incremental = true

[target.wasm32-unknown-unknown]

[profile.release]
opt-level = 'z'     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units
panic = 'abort'     # Remove panic formatting overhead
strip = true        # Strip debug info and symbols
