[package]
name = "holyballs"
version = "0.2.0"
edition = "2024"

[dependencies]
bevy = {version = "0.19.0"}
bevy_rapier3d = { version = "0.35.0", features = [ "simd-stable", "debug-render-3d" ] }
rand = "0.10.2"
bevy_fontmesh = {version="0.6.0"}
getrandom = { version = "0.4.3", features = ["wasm_js"] }
wasm-bindgen = "0.2.126"
crossfire = "3.1.19"
clap = { version = "4.6.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"


[profile.dev.package."*"]
opt-level = 3

[target.wasm32-unknown-unknown]
