<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>sodacan.io Game Update</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" sizes="any">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script type="importmap">
        {
          "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js",
                "admin": "./js/admin.js",
                "auth": "./js/auth.js",
                "jquery": "https://code.jquery.com/jquery-4.0.0.module.min.js",
                "bootstrap": "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js",
                "sortable": "./js/Sortable.min.js"
          }
        }
    </script>
    <style>
        .color-picker-wrapper {
            display: inline-block;
            width: 30px;
            height: 30px;
//            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #e2e8f0;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-picker-wrapper:hover {
            transform: scale(1.10);
            border-color: #cbd5e1;
        }
        .grab {
            cursor: grabbing;
        }
        tr {
            height: 52px;
            font-size: large;
        }
    </style>
</head>
<body>
<div class="container container-fluid p-3">
    <div class="row">
        <div class="navbar sticky-top bg-primary flex-md-nowrap p-0">
            <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3 fs-6 text-white" href="#">
                <img src="images/small-sodacan.png" alt="Sodacam logo">
                &nbsp;Sodacan.io
            </a>
            <ul class="nav justify-content-end pe-2">
                <li class="nav-item pb-2">
                    <a id="user-account" href="#" title="User Account"  class="icon-link" aria-label="User Account">
                        <div class="text-white small" id="username"></div>
                    </a>
                </li>
                <li class="nav-item pe-2">
                    <a id="login" href="#" title="Login"  class="icon-link" aria-label="Login">
                        <span class="text-white small">Login</span>
                        <img src="images/login.png" alt="Login">
                    </a>
                </li>
                <li class="nav-item pe-2">
                    <a id="logout" href="#" title="Logout"  class="icon-link" aria-label="Logout">
                        <img src="images/logout.png" alt="Logout">
                    </a>
                </li>
            </ul>
        </div>
    </div>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html?pane=admin">Home</a></li>
            <li class="breadcrumb-item"><a href="menu.html">Games</a></li>
            <li class="breadcrumb-item active gamename" aria-current="page"></li>
        </ol>
    </nav>
    <div class="align-middle">
        <form>
            <div class="row g-3 p-3">
                <div class="col-auto">
                    <label for="gameName" class="">Name</label>
                    <input type="text" size="10" class="form-control" id="gameName">
                </div>
                <div class="col-auto">
                    <label for="gameDescr" class="">Description</label>
                    <input type="text" size="40" class="form-control" id="gameDescr">
                </div>
                <div class="col-auto">
                    <label for="pace" class="">Toy Drop Rate (ms)</label>
                    <input type="number" class="form-control" id="pace">
                </div>
            </div>
            <div class="align-middle p-3">
                <label for="scoreboardPicker">Scoreboard color:</label>
                <input class="color-picker-wrapper" type="color" id="scoreboardPicker" name="scoreboardPicker" value="#ff0000">
                <label for="wallPicker">Wall color:</label>
                <input class="color-picker-wrapper" type="color" id="wallPicker" name="wallPicker" value="#F7F7FF">
                <label for="tablePicker">Table color:</label>
                <input class="color-picker-wrapper" type="color" id="tablePicker" name="tablePicker" value="#00F5FF">
                <label for="tablePicker">Fence color:</label>
                <input class="color-picker-wrapper" type="color" id="fencePicker" name="fencePicker" value="#7C4DFF">
                <label for="tablePicker">Barrier color:</label>
                <input class="color-picker-wrapper" type="color" id="barrierPicker" name="barrierPicker" value="#FF2DAA">
            </div>
        </form>
    </div>
    <table class="table align-middle">
        <thead class="table-light">
        <tr style="height: 52px;">
            <th>≡</th>
            <th>Orig<br/>Level</th>
            <th>New<br/>Level</th>
            <th>Summary</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="levels">
        <tr class="d-none prototype">
            <td data-field="grab" class="grab" aria-hidden="true">≡</td>
            <td data-field="level"></td>
            <td data-field="newLevel"></td>
            <td><span data-field="summary"></span><br/><span data-field="help"></span></td>
            <td>
                <a data-field="edit" href="#levelPanel" class="btn btn-link" title="Edit this level" data-bs-toggle="offcanvas" aria-label="Close">
                    <img src="images/edit.png" alt="Edit">
                </a>
                <a href="#" class="btn btn-link" title="Delete this game" data-bs-toggle="modal" data-bs-target="#delete-level-modal">
                    <img src="images/delete.png" alt="Delete">
                </a>
            </td>
        </tr>
        </tbody>
    </table>
<button class="btn btn-outline-secondary m-3 float-end" data-bs-toggle="offcanvas" data-bs-target="#levelPanel" aria-controls="levelPanel">
    <i class="bi bi-sliders me-1"></i> Filters
</button>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="levelPanel" aria-labelledby="levelPanelLabel">
    <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title" id="levelPanelLabel">Game Level</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <label class="form-label small fw-bold">Status</label>
        <select class="form-select mb-3"><option>Any</option><option>Active</option><option>Archived</option></select>
        <label class="form-label small fw-bold">Date range</label>
        <input type="date" class="form-control mb-3" aria-label="From date">
        <div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="f1" checked><label class="form-check-label" for="f1">Include drafts</label></div>
        <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="f2"><label class="form-check-label" for="f2">Only mine</label></div>
        <button class="btn btn-primary w-100">Apply filters</button>
    </div>
</div>
<script type="module">
    import $ from "jquery";
    import "bootstrap";
    import "sortable";
    import { login, logout, setCallbacks } from "auth";
    import { ifAdmin } from "admin";

    let $level_proto;

    let gameData;
    let originalGameData;

    $(document).ready(function() {
        $('#login').on('click', login);
        $('#logout').on('click', logout);
        setCallbacks(loggedIn, loggedOut);
        $level_proto = $("#levels").find(".prototype").clone(true);
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const gamename = urlParams.get('game');
        $(".gamename").text(gamename);
        fetch("./config/" + gamename + ".hb.json")
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                originalGameData = structuredClone(data);
                gameData = data;
                console.log("Fetched gameData", gameData.name);
                load_levels_table();
            });
    });

    function loggedIn(name) {
        $("#login").hide();
        $("#logout").show();
        $('#username').text(name).show();
        $('.logged-in').show();
    }
    function loggedOut() {
        $("#login").show();
        $("#logout").hide();
        $('#username').hide();
        $('.logged-in').hide();
    }

    function summarize(level) {
        let summary = "";
        if (level.balls) {
            if (summary.length > 0) {
                summary += ", ";
            }
            summary += level.balls + " balls";
        }
        if (level.blocks) {
            if (summary.length > 0) {
                summary += ", ";
            }
            summary += level.blocks + " blocks";
        }
        if (level.disks) {
            if (summary.length > 0) {
                summary += ", ";
            }
            summary += level.disks + " disks";
        }
        if (level.fences) {
            if (summary.length > 0) {
                summary += ", ";
            }
            summary += level.fences + " fences";
        }
        return summary;
    }
    function seq_changed(event) {
        console.log('Old index:', event.oldIndex);
        console.log('New index:', event.newIndex);
        let [old]  = gameData.levels.splice(event.oldIndex, 1);
        gameData.levels.splice(event.newIndex, 0, old);
        // for (const level of gameData.levels) {
        //     console.log("Revised levels:", summarize(level));
        // }
        // Renumber the newLevel column
        let newLevel = 0;
        $("#levels tr").each(function(index, level) {
            newLevel += 1;
//            console.log("Level:", newLevel, ", index:", index, ":", level.html);
            $(level).find("[data-field='newLevel']").text(index+1);
        });
//        console.log("Levels:", newLevel);
    }
    function load_levels_table() {
        $("#levels").empty();
        let levelNo = 0;
        $("#scoreboardPicker").val(gameData.scoreboard_color);
        $("#wallPicker").val(gameData.wall_color);
        $("#tablePicker").val(gameData.table_color);
        $("#fencePicker").val(gameData.fence_color);
        $("#barrierPicker").val(gameData.barrier_color);
        gameData.levels.forEach((level, index) => {
//            console.log($(this));
            levelNo += 1;
            let $copy = $level_proto.clone(true);
            $copy.find("[data-field='summary']").text(summarize(level));
            if (level.help) {
//                console.log("Help:", level.help);
                $copy.find("[data-field='help']").html(level.help.replaceAll("\n","&#9166;"));
            }
            $copy.find("[data-field='level']").text(levelNo);
            $copy.find("[data-field='newLevel']").text(levelNo);
            $copy.removeClass("prototype");
            $copy.removeClass("d-none");
            $("#levels").append($copy);
        });
        new Sortable(levels, {
            handle: '.grab',
            animation: 150,
            onEnd: seq_changed,
        });
    }
    function unload_levels_table() {
        $("#levels").empty();
    }
</script>
</body>
</html>
