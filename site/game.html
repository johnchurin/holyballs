<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>sodacan.io Game Update</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" sizes="any">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script type="importmap">
        {
          "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js",
                "admin": "./js/admin.js",
                "auth": "./js/auth.js",
                "jquery": "https://code.jquery.com/jquery-4.0.0.module.min.js",
                "bootstrap": "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js",
                "sortable": "./js/Sortable.min.js"
          }
        }
    </script>
    <style>
        .color-picker-wrapper {
            display: inline-block;
            width: 30px;
            height: 30px;
//            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #e2e8f0;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-picker-wrapper:hover {
            transform: scale(1.10);
            border-color: #cbd5e1;
        }
        .grab {
            cursor: grabbing;
        }
        tr {
            height: 52px;
            font-size: large;
        }
    </style>
</head>
<body>
<div class="container container-fluid p-3">
    <div class="row">
        <div class="navbar sticky-top bg-primary flex-md-nowrap p-0">
            <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3 fs-6 text-white" href="#">
                <img src="images/small-sodacan.png" alt="Sodacam logo">
                &nbsp;Sodacan.io
            </a>
            <ul class="nav justify-content-end pe-2">
                <li class="nav-item pb-2">
                    <a id="user-account" href="#" title="User Account"  class="icon-link" aria-label="User Account">
                        <div class="text-white small" id="username"></div>
                    </a>
                </li>
                <li class="nav-item pe-2">
                    <a id="login" href="#" title="Login"  class="icon-link" aria-label="Login">
                        <span class="text-white small">Login</span>
                        <img src="images/login.png" alt="Login">
                    </a>
                </li>
                <li class="nav-item pe-2">
                    <a id="logout" href="#" title="Logout"  class="icon-link" aria-label="Logout">
                        <img src="images/logout.png" alt="Logout">
                    </a>
                </li>
            </ul>
        </div>
    </div>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html?pane=admin">Home</a></li>
            <li class="breadcrumb-item"><a href="menu.html">Games</a></li>
            <li class="breadcrumb-item active gamename" aria-current="page"></li>
        </ol>
    </nav>
    <button class="btn btn-primary" id="downloadBtn">Download</button>
    <div class="align-middle">
        <form>
            <div class="row g-3 p-3">
                <div class="col-auto">
                    <label for="gameName" class="">Name</label>
                    <input type="text" size="15" disabled class="form-control" id="gameName">
                </div>
                <div class="col-auto">
                    <label for="gameDescr" class="">Description</label>
                    <input type="text" size="40" class="form-control" id="gameDescr">
                </div>
                <div class="col-auto">
                    <label for="pace" class="">Toy Drop Rate (ms)</label>
                    <input id="pace" type="range" class="form-range" step="100" min="100" max="5000">
                </div>
            </div>
            <div class="align-middle p-3">
                <label for="scoreboardPicker">Scoreboard color:</label>
                <input class="color-picker-wrapper color-edit" data-name="scoreboard_color" type="color" id="scoreboardPicker" name="scoreboardPicker" value="#ff0000">
                <label for="wallPicker">Wall color:</label>
                <input class="color-picker-wrapper color-edit" data-name="wall_color" type="color" id="wallPicker" name="wallPicker" value="#F7F7FF">
                <label for="tablePicker">Table color:</label>
                <input class="color-picker-wrapper color-edit" data-name="table_color" type="color" id="tablePicker" name="tablePicker" value="#00F5FF">
                <label for="tablePicker">Fence color:</label>
                <input class="color-picker-wrapper color-edit" data-name="fence_color" type="color" id="fencePicker" name="fencePicker" value="#7C4DFF">
                <label for="tablePicker">Barrier color:</label>
                <input class="color-picker-wrapper color-edit" data-name="barrier_color" type="color" id="barrierPicker" name="barrierPicker" value="#FF2DAA">
            </div>
        </form>
    </div>
    <table class="table align-middle">
        <thead class="table-light">
        <tr style="height: 52px;">
            <th>≡</th>
            <th>Orig<br/>Level</th>
            <th>New<br/>Level</th>
            <th>Summary</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="levels">
        <tr class="d-none prototype">
            <td data-field="grab" class="grab" aria-hidden="true">≡</td>
            <td data-field="level"></td>
            <td data-field="newLevel"></td>
            <td><span data-field="summary"></span><br/><span data-field="help"></span></td>
            <td>
                <a data-field="edit" href="#" class="btn btn-link" title="Edit this level" aria-label="Edit Level">
                    <img src="images/edit.png" alt="Edit">
                </a>
                <a href="#" class="btn btn-link" title="Delete this game" data-bs-toggle="modal" data-bs-target="#delete-level-modal">
                    <img src="images/delete.png" alt="Delete">
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="levelPanel" aria-labelledby="levelPanelLabel">
    <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title" id="levelPanelLabel">Game Level</h5>
        <button type="button" class="btn-close" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body level-update">
        <label class="form-label small fw-bold" data-name="Balls" for="editballs"></label>
            <input id="editballs" type="range" class="form-range level-edit"  data-level-field="balls" min="1" max="20">
        <label class="form-label small fw-bold" data-name="Blacks" for="editblacks"></label>
            <input id="editblacks" type="range" class="form-range level-edit"  data-level-field="blacks" min="0" max="20">
        <label class="form-label small fw-bold" data-name="Blocks"  for="editblocks"></label>
            <input id="editblocks" type="range" class="form-range level-edit" data-level-field="blocks" min="0" max="20">
        <label class="form-label small fw-bold" data-name="Bumpies" for="editbumpys"></label>
            <input id="editbumpys" type="range" class="form-range level-edit"  data-level-field="bumpys" min="0" max="20">
        <label class="form-label small fw-bold" data-name="Cones" for="editcones"></label>
            <input id="editcones" type="range" class="form-range level-edit"  data-level-field="cones" min="0" max="20">
        <label class="form-label small fw-bold" data-name="Cylinders" for="editcylinders"></label>
            <input id="editcylinders" type="range" class="form-range level-edit"  data-level-field="cylinders" min="0" max="20">
        <label class="form-label small fw-bold" data-name="Dips" for="editdips"></label>
            <input id="editdips" type="range" class="form-range level-edit"  data-level-field="dips" min="0" max="20">
        <label class="form-label small fw-bold" data-name="Disks" for="editdisks"></label>
            <input id="editdisks" type="range" class="form-range level-edit"  data-level-field="disks" min="0" max="20">
        <label class="form-label small fw-bold" data-name="GHosts" for="editghosts"></label>
            <input id="editghosts" type="range" class="form-range level-edit"  data-level-field="ghosts" min="0" max="20">
        <label class="form-label small fw-bold" data-name="Lifesavers" for="editlifesavers"></label>
            <input id="editlifesavers" type="range" class="form-range level-edit"  data-level-field="lifesavers" min="0" max="20">
        <label class="form-label small fw-bold" data-name="Spikeys" for="editspikeys"></label>
            <input id="editspikeys" type="range" class="form-range level-edit"  data-level-field="spikeys" min="0" max="20">

        <div class="form-check mb-2">
            <label class="form-label small fw-bold">Targets</label>
            <div class="row">
                <div class="col">
                    <input class="form-check-input" type="checkbox" id="target1" checked>
                    <label class="form-check-label" for="target1">Disk on Scoreboard</label>
                </div>
                <div class="col">
                    <input class="form-check-input" type="checkbox" id="target2" checked>
                    <label class="form-check-label" for="target2">Square on Scoreboard</label>
                </div>
            </div>
        </div>
        <div class="form-check mb-2">
            <label class="form-label small fw-bold">Fences</label>
            <div class="row">
                <div class="col">
                    <input class="form-check-input" type="checkbox" id="fenceback" checked>
                    <label class="form-check-label" for="fenceback">Back</label>
                </div>
                <div class="col">
                    <input class="form-check-input" type="checkbox" id="fencefront" checked>
                    <label class="form-check-label" for="fencefront">Front</label>
                </div>
                <div class="col">
                    <input class="form-check-input" type="checkbox" id="fenceleft" checked>
                    <label class="form-check-label" for="fenceleft">Left</label>
                </div>
                <div class="col">
                    <input class="form-check-input" type="checkbox" id="fenceright" checked>
                    <label class="form-check-label" for="fenceright">Right</label>
                </div>
            </div>
        </div>

        <button id="doneEditing" class="btn btn-primary">Done Editing Level</button>
    </div>
</div>
<script type="module">
    import $ from "jquery";
    import "bootstrap";
    import "sortable";
    import { login, logout, setCallbacks } from "auth";
    import { ifAdmin } from "admin";

    let $level_proto;
    let gameName;
    let gameData;
    let levelEditData;
    let originalGameData;

    $(document).ready(function() {
        $('#login').on('click', login);
        $('#logout').on('click', logout);
        setCallbacks(loggedIn, loggedOut);
        $level_proto = $("#levels").find(".prototype").clone(true);
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        gameName = urlParams.get('game');
        $(".gamename").text(gameName);
        fetch("./config/" + gameName + ".hb.json")
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                originalGameData = structuredClone(data);
                gameData = data;
                console.log("Fetched gameData", gameData.name);
                load_levels_table();
                load_game_details();
            });

        $(".color-edit").on('change', function() {
            let name = $(this).attr("data-name");
            gameData[name] = $(this).val();
        });

        // Update label for this input with count
        $(".level-edit").on('change', function() {
            let $label = $('label[for="' + $(this).attr('id') + '"]');
            let name = $label.attr("data-name");
            $label.text(name + " [" + $(this).val() +"]");
//            console.log($(this).val());
        });
        $("#pace").on('change', function() {
            let $label = $('label[for="' + $(this).attr('id') + '"]');
            let pace = $(this).val();
            $label.text("Pace " + pace +"ms");
            // Update gameData
            gameData.pace = pace;
//            console.log($(this).val());
        });
        $("#gameDescr").on('change', function() {
            let descr = $(this).val();
            gameData.name = descr;
        });
        $("#doneEditing").on("click", function() {
            $(".offcanvas").removeClass("show");
            $(".offcanvas").trigger('hide.bs.offcanvas');
        });
        $("#downloadBtn").on("click", function() {
            const myData = new Blob([JSON.stringify(gameData, null, 2)], { type: 'application/json' });
            const downloadUrl = URL.createObjectURL(myData);
            const downloadLink = document.createElement('a');
            downloadLink.href = downloadUrl;
            downloadLink.download = gameName + '.hb1.json';
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(downloadUrl);
        });
    });

    function loggedIn(name) {
        $("#login").hide();
        $("#logout").show();
        $('#username').text(name).show();
        $('.logged-in').show();
    }
    function loggedOut() {
        $("#login").show();
        $("#logout").hide();
        $('#username').hide();
        $('.logged-in').hide();
    }

    function summarize(level) {
        let summary = "";
        if (level.balls && level.balls > 0) {
            if (summary.length > 0) {
                summary += ", ";
            }
            summary += level.balls + " balls";
        } else {
            delete level["balls"];
        }
        if (level.blocks && level.blocks > 0) {
            if (summary.length > 0) {
                summary += ", ";
            }
            summary += level.blocks + " blocks";
        } else {
            delete level["blocks"];
        }
        if (level.disks && level.disks > 0 ) {
            if (summary.length > 0) {
                summary += ", ";
            }
            summary += level.disks + " disks";
        } else {
            delete level["disks"];
        }
        if (level.fences && level.fences !== 0) {
            if (summary.length > 0) {
                summary += ", ";
            }
            if (level.fences === 15) {
                summary += "all fences";
            } else {
                if ((level.fences & 1) !==0) {
                    summary += "back "
                }
                if ((level.fences & 2) !==0) {
                    summary += "front "
                }
                if ((level.fences & 4) !==0) {
                    summary += "left "
                }
                if ((level.fences & 8) !==0) {
                    summary += "right "
                }
                summary +=  "fences";
            }
        } else {
            delete level["fences"];
        }
        return summary;
    }
    function seq_changed(event) {
        console.log('Old index:', event.oldIndex);
        console.log('New index:', event.newIndex);
        let [old]  = gameData.levels.splice(event.oldIndex, 1);
        gameData.levels.splice(event.newIndex, 0, old);
        // for (const level of gameData.levels) {
        //     console.log("Revised levels:", summarize(level));
        // }
        // Renumber the newLevel column
        let newLevel = 0;
        $("#levels tr").each(function(index, level) {
            newLevel += 1;
//            console.log("Level:", newLevel, ", index:", index, ":", level.html);
            $(level).find("[data-field='newLevel']").text(index+1);
        });
//        console.log("Levels:", newLevel);
    }
    function load_levels_table() {
        $("#levels").empty();
        let levelNo = 0;
        $("#scoreboardPicker").val(gameData.scoreboard_color);
        $("#wallPicker").val(gameData.wall_color);
        $("#tablePicker").val(gameData.table_color);
        $("#fencePicker").val(gameData.fence_color);
        $("#barrierPicker").val(gameData.barrier_color);

            gameData.levels.forEach((level, index) => {
//            console.log($(this));
            levelNo += 1;
            let $copy = $level_proto.clone(true);
            let $summary = $copy.find("[data-field='summary']");
            $summary.text(summarize(level));
            if (level.help) {
//                console.log("Help:", level.help);
                $copy.find("[data-field='help']").html(level.help.replaceAll("\n","&#9166;"));
            }
            $copy.find("[data-field='level']").text(levelNo);
            $copy.find("[data-field='newLevel']").text(levelNo);
            $copy.attr("data-level",levelNo);
            $copy.removeClass("prototype");
            $copy.removeClass("d-none");
            $copy.find("[data-field='edit']").on("click", {level: level, element: $summary}, function(event) {
                let $offcanvas = $("#levelPanel");
                $offcanvas.addClass("show");
                $offcanvas.off('hide.bs.offcanvas');
                $offcanvas.on('hide.bs.offcanvas', event.data, function(event) {
                    console.log('Modal is starting to close..., resummarize');
                    let level = event.data.level;
                    event.data.element.text(summarize(level));
                });
                loadLevelEditor(event.data.level);
            });
            $("#levels").append($copy);
        });
        new Sortable(levels, {
            handle: '.grab',
            animation: 150,
            onEnd: seq_changed,
        });
    }

    function load_game_details() {
        $("#gameName").val(gameName);
        $("#gameDescr").val(gameData.name);
        $("#gameDescr").trigger('change');
        $("#pace").val(gameData.pace);
        $("#pace").trigger('change');
    }
    // Load the level editor data
    function loadLevelEditor(level) {
        $(".level-update").off('change');
        $("[data-level-field]").each( function() {
            let field = $(this).attr("data-level-field");
//            console.log("Field:", field);
            if (level[field]) {
                $(this).val(level[field]);
            } else {
                $(this).val("0");
            }
            $(this).trigger('change');
        })
        if (level.fences) {
            $("#fenceback").prop("checked", ((level.fences & 1) !== 0));
            $("#fencefront").prop("checked", ((level.fences & 2) !== 0));
            $("#fenceleft").prop("checked", ((level.fences & 4) !== 0));
            $("#fenceright").prop("checked", ((level.fences & 8) !== 0));
        } else {
            $("#fenceback").prop("checked", false);
            $("#fencefront").prop("checked", false);
            $("#fenceleft").prop("checked", false);
            $("#fenceright").prop("checked", false);

        }
        $(".level-update").on('change', level, function() {
            $("[data-level-field]").each( function() {
                let field = $(this).attr("data-level-field");
                level[field] = $(this).val();
            });
            // level.balls = $("#editballs").val();
            // level.blocks = $("#editblocks").val();
            // level.disks = $("#editdisks").val();
            level.fences =
                $("#fenceback").prop("checked") << 0 |
                $("#fencefront").prop("checked") << 1 |
                $("#fenceleft").prop("checked") << 2 |
                $("#fenceright").prop("checked") << 3;
        });
    }
</script>
</body>
</html>
